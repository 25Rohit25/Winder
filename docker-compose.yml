version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: windctrl-backend
    ports:
      - "8000:8000"
    environment:
      - WINDCTRL_ENV=production
      - WINDCTRL_HOST=0.0.0.0
      - WINDCTRL_PORT=8000
    volumes:
      - ./data:/app/data
      - ./reports/generated:/app/reports/generated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: windctrl-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
