name: WindCtrl Validate CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Engineering Verification & Reporting Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install TeX Live (pdflatex)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff mypy

      - name: Static Code Analysis & Linting
        run: |
          ruff check backend/ scripts/
          ruff format --check backend/ scripts/

      - name: Run Unit Tests with Boundary Coverage
        run: |
          python -m pytest backend/tests/unit/ -v --cov=backend/app --cov-report=xml --cov-report=term

      - name: Run Property-Based Hypothesis Tests
        run: |
          python -m pytest backend/tests/property/ -v

      - name: Run End-to-End Integration Tests
        run: |
          python -m pytest backend/tests/integration/ -v

      - name: Run Known Fault Detection Regression Suite
        run: |
          python -m pytest backend/tests/regression/ -v

      - name: Generate Synthetic Telemetry Scenarios
        run: |
          python scripts/generate_sample_data.py --out-dir=data

      - name: Run Batch Supervisory Controller Validation
        run: |
          python scripts/run_validation.py --all-baseline

      - name: Compile Engineering Audit PDF & LaTeX Reports
        run: |
          python scripts/generate_report.py data/baseline/normal_run.csv --author="CI Validation Bot" --org="Automated Controls Pipeline"

      - name: Archive Generated Certification Reports
        uses: actions/upload-artifact@v4
        with:
          name: windctrl-validation-report
          path: reports/generated/
          if-no-files-found: error
          retention-days: 14

      - name: Install Frontend Dependencies & Build UI
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Archive Frontend Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: windctrl-ui-dist
          path: frontend/dist/
          retention-days: 7
